<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>photo english card</title>
<style>
@font-face { font-family: "Fraunces"; font-style: normal; font-weight: 100 900; src: url("__FONT_ROMAN__") format("woff2"); }
@font-face { font-family: "Fraunces"; font-style: italic; font-weight: 100 900; src: url("__FONT_ITALIC__") format("woff2"); }

:root {
  --bg: #f7f0e4; --ink: #3a2016; --accent: #b23a2b; --muted: #7b6353; --chip: #ecdfca;
  --en: "Fraunces", Georgia, "Times New Roman", serif;
  --cn: "Noto Serif SC", "Source Han Serif SC", "Songti SC", "STZhongsong", "SimSun", serif;
}
[data-palette="matcha"] { --bg: #f3f1e3; --ink: #26331f; --accent: #6f8a2f; --muted: #66705a; --chip: #e1e3c8; }
[data-palette="ocean"]  { --bg: #f1f1ea; --ink: #172a3d; --accent: #c2583a; --muted: #5d6b78; --chip: #dbe2e2; }
[data-palette="berry"]  { --bg: #f8eee9; --ink: #3d1a2a; --accent: #b83a5e; --muted: #7d5a66; --chip: #efd9d6; }

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); }
body { width: 1080px; }
#poster {
  width: 1080px; background: var(--bg); color: var(--ink); overflow: hidden;
  font-family: var(--en), var(--cn); font-variation-settings: "SOFT" 100, "WONK" 0;
  -webkit-font-smoothing: antialiased;
}
.cn { font-family: var(--cn); }

/* ---------- hero ---------- */
.hero { position: relative; height: 610px; }
.hero .photo {
  position: absolute; top: 0; right: 0; width: 59%; height: 100%;
  border-bottom-left-radius: 310px; overflow: hidden;
}
.hero .photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.hero .words {
  position: absolute; left: 40px; top: 0; bottom: 0; width: 420px;
  display: flex; flex-direction: column; justify-content: center;
}
.title {
  font-weight: 900; line-height: .84; letter-spacing: -.02em; text-transform: lowercase;
  font-variation-settings: "SOFT" 100, "WONK" 1, "opsz" 144;
  transform: rotate(-3deg); transform-origin: left center; margin-bottom: 30px; position: relative; width: max-content;
}
.title span { display: block; white-space: nowrap; width: max-content; }
.subtitle { font-family: var(--cn); font-weight: 900; font-size: 33px; letter-spacing: .04em; white-space: nowrap; }
.subtitle::after { content: ""; display: block; width: 46px; height: 4px; border-radius: 2px; background: var(--accent); margin: 14px 0 16px; }
.tags { font-size: 19px; line-height: 1.3; letter-spacing: .05em; color: var(--ink); max-width: 400px; }
.doodle { position: absolute; stroke: var(--ink); stroke-width: 5; stroke-linecap: round; fill: none; }
.doodle.light { stroke: #fff; }

/* ---------- sections ---------- */
.rule { border-top: 2px solid var(--ink); }
.cols { display: flex; margin: 0 32px; }
.col { padding: 0 0 6px; }
.col.left { width: 44%; padding-right: 22px; border-right: 2px solid var(--ink); }
.col.right { flex: 1; padding-left: 22px; }
.col section + section { border-top: 2px solid var(--ink); margin-top: 16px; }
h2 { display: flex; align-items: baseline; gap: 10px; font-size: 35px; font-weight: 700; text-transform: lowercase; letter-spacing: -.01em; padding: 10px 0 8px; }
h2 b { color: var(--accent); font-size: 46px; font-weight: 600; font-variation-settings: "SOFT" 100, "WONK" 1, "opsz" 144; }
h2 i { font-style: normal; font-size: 26px; }

.vocab li, .phrases li { display: flex; align-items: center; list-style: none; }
.vocab li { gap: 16px; }
.vocab .ico {
  flex: none; width: 58px; height: 58px; margin: 4px 0; border-radius: 50%; overflow: hidden; position: relative;
  background: var(--chip); display: flex; align-items: center; justify-content: center; font-size: 32px;
  font-family: "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif;
}
.vocab .ico img { position: absolute; max-width: none; }
.vocab .row { flex: 1; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 15px 0 13px; border-bottom: 2px dotted color-mix(in srgb, var(--ink) 45%, transparent); }
.vocab li:last-child .row, .phrases li:last-child .row { border-bottom: 0; }
.vocab .en { font-size: 25px; font-weight: 600; }
.vocab .cn { font-size: 19px; flex: none; min-width: 6.2em; }

.dot { flex: none; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); margin-right: 16px; }
.phrases .row { flex: 1; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 8px 0 7px; border-bottom: 2px dotted color-mix(in srgb, var(--ink) 45%, transparent); }
.phrases .en { font-size: 20.5px; font-weight: 500; }
.phrases .cn { font-size: 17px; flex: none; min-width: 9.2em; }

.patterns li { display: flex; list-style: none; padding: 7px 0; }
.patterns .dot { margin-top: 11px; }
.patterns .en { font-size: 20px; font-weight: 500; line-height: 1.3; }
.patterns .cn { font-size: 16.5px; line-height: 1.5; color: var(--muted); }

.scene .en { font-size: 19.5px; line-height: 1.42; font-weight: 400; }
.scene .cn { font-size: 16.5px; line-height: 1.6; color: var(--muted); margin-top: 12px; }

.practice { margin: 0 32px; border-top: 2px solid var(--ink); }
.prompts { display: flex; }
.prompts li { flex: 1; display: flex; gap: 14px; list-style: none; padding: 2px 18px 0 18px; border-left: 2px solid color-mix(in srgb, var(--ink) 45%, transparent); }
.prompts li:first-child { padding-left: 0; border-left: 0; }
.prompts .n { flex: none; width: 36px; height: 36px; border-radius: 50%; background: var(--accent); color: var(--bg); font-size: 22px; font-weight: 700; display: flex; align-items: center; justify-content: center; }
.prompts .q { font-size: 20px; font-weight: 500; line-height: 1.25; }
.prompts .hint { font-size: 15.5px; line-height: 1.4; color: var(--muted); margin-top: 6px; }

.tip { margin: 16px 32px 0; padding: 12px 0 22px; border-top: 2px dotted color-mix(in srgb, var(--ink) 45%, transparent); display: flex; align-items: baseline; gap: 12px; font-size: 17.5px; }
.tip svg { flex: none; width: 26px; height: 26px; align-self: center; stroke: var(--accent); stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.tip b { font-weight: 700; }
.tip .bar { opacity: .5; }
.tip .cn { font-size: 16px; color: var(--muted); }
</style>
</head>
<body>
<div id="poster">
  <header class="hero">
    <div class="photo"><img id="hero-img" alt=""></div>
    <div class="words">
      <h1 class="title" id="title"></h1>
      <div class="subtitle" id="subtitle"></div>
      <div class="tags" id="tags"></div>
    </div>
    <svg class="doodle light" style="right:26px;bottom:34px" width="56" height="56" viewBox="0 0 56 56"><path d="M8 30 L28 22 M16 48 L34 36 M36 52 L44 40"/></svg>
  </header>

  <div class="cols rule" style="border-top-width:2px">
    <div class="col left">
      <section><h2><b>01</b><i>·</i><span id="h1"></span></h2><ul class="vocab" id="vocab"></ul></section>
      <section class="scene"><h2><b>04</b><i>·</i><span id="h4"></span></h2><p class="en" id="scene-en"></p><p class="cn" id="scene-cn"></p></section>
    </div>
    <div class="col right">
      <section><h2><b>02</b><i>·</i><span id="h2"></span></h2><ul class="phrases" id="phrases"></ul></section>
      <section><h2><b>03</b><i>·</i><span id="h3"></span></h2><ul class="patterns" id="patterns"></ul></section>
    </div>
  </div>

  <section class="practice"><h2><b>05</b><i>·</i><span id="h5"></span></h2><ul class="prompts" id="prompts"></ul></section>

  <footer class="tip">
    <svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1.1 2.2h5c.1-1 .5-1.7 1.1-2.2A6 6 0 0 0 12 3z"/></svg>
    <span><b id="tip-label"></b> <span id="tip-en"></span></span><span class="bar">|</span><span class="cn" id="tip-cn"></span>
  </footer>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
(async () => {
  const d = JSON.parse(document.getElementById('data').textContent);
  const $ = id => document.getElementById(id);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
  const L = Object.assign({ vocabulary: 'key vocabulary', phrases: 'natural phrases', patterns: 'useful sentence patterns', scene: 'describe the scene', practice: 'speak & write', hint: '提示', tip: 'Study tip:' }, d.labels || {});

  if (d.palette) $('poster').dataset.palette = d.palette;
  const hero = $('hero-img');
  hero.src = d.photo;
  const [fx, fy] = d.focus || [0.5, 0.5];
  hero.style.objectPosition = `${fx * 100}% ${fy * 100}%`;

  const lines = Array.isArray(d.title) ? d.title : String(d.title).split('\n');
  for (const t of lines) $('title').append(el('span', '', t));
  $('title').insertAdjacentHTML('beforeend', '<svg class="doodle" style="right:-58px;top:6%" width="50" height="50" viewBox="0 0 50 50"><path d="M8 40 L18 24 M24 44 L40 34 M4 22 L6 8"/></svg>');
  $('subtitle').textContent = d.subtitle_cn || '';
  $('tags').textContent = (d.tags || []).join(' · ');
  $('h1').textContent = L.vocabulary; $('h2').textContent = L.phrases; $('h3').textContent = L.patterns;
  $('h4').textContent = L.scene; $('h5').textContent = L.practice;

  const icons = [];
  for (const v of d.vocabulary || []) {
    const li = el('li'), ico = el('div', 'ico'), row = el('div', 'row');
    if (v.crop) { const im = el('img'); im.src = d.photo; ico.append(im); icons.push([ico, im, v.crop]); }
    else ico.textContent = v.emoji || '✦';
    row.append(el('span', 'en', v.en), el('span', 'cn', v.cn));
    li.append(ico, row); $('vocab').append(li);
  }
  for (const p of d.phrases || []) {
    const li = el('li'), row = el('div', 'row');
    row.append(el('span', 'en', p.en), el('span', 'cn', p.cn));
    li.append(el('span', 'dot'), row); $('phrases').append(li);
  }
  for (const p of d.patterns || []) {
    const li = el('li'), box = el('div');
    box.append(el('div', 'en', p.en), el('div', 'cn', p.cn));
    li.append(el('span', 'dot'), box); $('patterns').append(li);
  }
  $('scene-en').textContent = d.scene?.en || ''; $('scene-cn').textContent = d.scene?.cn || '';
  (d.prompts || []).forEach((p, i) => {
    const li = el('li'), box = el('div');
    box.append(el('div', 'q', p.q), el('div', 'hint', `${L.hint}: ${(p.hints || []).join(' / ')}`));
    li.append(el('span', 'n', i + 1), box); $('prompts').append(li);
  });
  $('tip-label').textContent = L.tip; $('tip-en').textContent = d.tip?.en || ''; $('tip-cn').textContent = d.tip?.cn || '';

  await document.fonts.ready;
  try { await hero.decode(); } catch {}

  // vocabulary thumbnails: crop = [centerX, centerY, width], all as fractions of the photo
  for (const [ico, im, [cx, cy, w]] of icons) {
    const size = ico.clientWidth, iw = size / w, ih = iw * hero.naturalHeight / hero.naturalWidth;
    const clamp = (v, lo) => Math.min(0, Math.max(lo, v));
    im.style.width = iw + 'px';
    im.style.left = clamp(size / 2 - cx * iw, size - iw) + 'px';
    im.style.top = clamp(size / 2 - cy * ih, size - ih) + 'px';
  }

  // shrink the title until its longest line fits the text column
  const title = $('title'), max = title.parentElement.clientWidth - 40;
  let fs = 178;
  do { title.style.fontSize = fs + 'px'; fs -= 4; }
  while (fs > 60 && (Math.max(...[...title.querySelectorAll('span')].map(s => s.offsetWidth)) > max || title.offsetHeight > 400));

  // overflow report for the render script
  const tight = [...document.querySelectorAll('.vocab .row, .phrases .row')].filter(r => r.scrollWidth > r.clientWidth + 1 || r.offsetHeight > 62).map(r => r.firstChild.textContent);
  if (location.hash === '#measure') document.documentElement.innerHTML = `<body>MEASURE:${JSON.stringify({ height: $('poster').offsetHeight, titlePx: fs + 4, wrapped: tight })}:END</body>`;
})();
</script>
</body>
</html>
